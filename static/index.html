<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Application</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div id="root">
      <!-- AUTHENTICATION CONTAINER -->
      <div id="login-container">
        <!-- LOGIN SECTION -->
        <div id="login-section">
          <h1>Login</h1>
          <form id="login-form">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required />
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required />
            <button type="submit">Login</button>
          </form>
          <p class="toggle-text">
            Don't have an account? <span id="show-signup">Sign up</span>
          </p>
        </div>

        <!-- SIGNUP SECTION (Hidden by default) -->
        <div id="signup-section" style="display: none">
          <h1>Sign Up</h1>
          <form id="signup-form">
            <label for="signup-username">Username:</label>
            <input type="text" id="signup-username" required />

            <label for="signup-email">Email:</label>
            <input type="email" id="signup-email" required />

            <label for="signup-password">Password:</label>
            <input type="password" id="signup-password" required />

            <label for="signup-confirm-password">Confirm Password:</label>
            <input type="password" id="signup-confirm-password" required />

            <button type="submit">Create Account</button>
          </form>
          <p class="toggle-text">
            Already have an account? <span id="show-login">Login</span>
          </p>
        </div>
      </div>

      <!-- CHAT CONTAINER (Hidden by default) -->
      <div id="chat-container" style="display: none">
        <!-- SIDEBAR -->
        <div id="room-list">
          <h2>Rooms</h2>
          <ul id="room-list-items"></ul>
          <button id="create-room-button">Create Room</button>
        </div>

        <!-- MAIN CHAT WINDOW -->
        <div id="chat-window">
          <h2>Select a room</h2>
          <div id="messages-container"></div>
          <form id="message-form">
            <input
              type="text"
              id="message-input"
              placeholder="Type a message..."
              required
            />
            <button type="submit">Send</button>
          </form>
        </div>
      </div>
    </div>
    <script src="/static/script.js"></script>
  </body>
</html>
